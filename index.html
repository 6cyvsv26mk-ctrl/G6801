<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>京广高铁 G6801 次 - 硬核拟真版</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; user-select: none; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }
        
        /* 启动出乘任务单 */
        #start-overlay {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(15, 20, 28, 0.95); color: white; z-index: 999;
            display: flex; justify-content: center; align-items: center;
            transition: opacity 0.5s;
        }
        .task-card {
            background: #1e2430; border: 2px solid #4CAF50; border-radius: 12px;
            padding: 25px; width: 90%; max-width: 400px; box-shadow: 0 10px 30px rgba(76, 175, 80, 0.2);
        }
        .task-card h1 { text-align: center; color: #4CAF50; font-size: 22px; margin: 0 0 15px 0; }
        .task-divider { height: 1px; background: linear-gradient(to right, transparent, #4CAF50, transparent); margin-bottom: 20px; }
        .task-content p { font-size: 14px; line-height: 1.8; color: #ccc; margin-bottom: 10px; }
        .highlight-train { color: #FF9800; font-size: 18px; font-weight: bold; letter-spacing: 1px; }
        #start-btn {
            background: #4CAF50; color: white; border: none; padding: 15px 40px; font-size: 18px; 
            border-radius: 30px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 20px;
            transition: transform 0.1s;
        }
        #start-btn:active { transform: scale(0.98); }
        
        /* 顶部 HUD */
        .top-hud { position: absolute; top: 20px; right: 20px; background: rgba(0,0,0,0.85); padding: 12px 15px; border-radius: 8px; color: white; text-align: right; border: 1px solid #4CAF50; z-index: 10; min-width: 200px;}
        .top-hud .next-station { font-size: 14px; color: #aaa; margin-bottom: 5px; }
        .top-hud .dist { font-size: 24px; font-weight: bold; color: #4CAF50; margin-bottom: 8px;}
        .top-hud .time-info { font-size: 13px; margin-bottom: 4px; }
        
        /* 1公里停车辅助标尺 */
        #parking-aid { display: none; margin-top: 12px; border-top: 1px solid #444; padding-top: 12px; }
        .ruler-container { position: relative; width: 100%; height: 30px; background: #222; border-radius: 4px; overflow: hidden; margin-top: 5px; border: 1px solid #333;}
        .ruler-center-line { position: absolute; top: 0; left: 50%; width: 2px; height: 100%; background: #f44336; z-index: 2;}
        .ruler-slider { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(76, 175, 80, 0.4); transition: width 0.1s;}
        .ruler-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 12px; font-weight: bold; color: #fff; z-index: 3; text-shadow: 1px 1px 2px #000;}
        .ruler-marks { display: flex; justify-content: space-between; font-size: 10px; color: #888; margin-top: 4px;}

        /* 底部控制台 */
        .ui-layer { position: absolute; bottom: 0; left: 0; width: 100%; background: rgba(15, 20, 28, 0.9); backdrop-filter: blur(8px); color: white; padding: 15px 20px; box-sizing: border-box; border-top: 2px solid #4CAF50; display: flex; flex-direction: column; gap: 12px; z-index: 10; }
        .dashboard { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .speed-display { font-size: 42px; font-weight: bold; line-height: 1; color: #fff; }
        .speed-display span { font-size: 14px; color: #888; }
        .status-panel { text-align: right; font-size: 14px; max-width: 60%;}
        
        .slider-group { display: flex; align-items: center; gap: 15px; }
        .slider-group label { width: 45px; font-weight: bold; color: #64B5F6; font-size: 16px;}
        input[type="range"] { flex: 1; -webkit-appearance: none; height: 10px; background: #333; border-radius: 5px; outline: none; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; background: #fff; border-radius: 50%; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.5); }
        .slider-group .value { width: 40px; text-align: center; font-weight: bold; font-size: 16px;}
        
        .btn-grid { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 5px;}
        button.action-btn { flex: 1; background: #2c3545; color: #fff; border: none; padding: 14px 5px; border-radius: 6px; font-size: 15px; cursor: pointer; transition: 0.2s; min-width: 90px; font-weight: bold;}
        button.action-btn:active { transform: scale(0.96); }
        button.action-btn.active { background: #4CAF50; box-shadow: 0 0 10px rgba(76,175,80,0.5); }
        button.danger { background: #d32f2f; }
        button.warning { background: #f57c00; }
        
        /* 提示与弹窗 */
        #atp-warning { display: none; position: absolute; top: 15%; left: 50%; transform: translateX(-50%); background: rgba(244, 67, 54, 0.95); color: white; padding: 20px 40px; border-radius: 10px; font-size: 22px; font-weight: bold; text-align: center; z-index: 100; box-shadow: 0 0 30px red; animation: pulse 1s infinite; border: 2px solid #fff;}
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }

        #perfect-text { display: none; position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); font-size: 48px; font-weight: bold; color: #4CAF50; text-shadow: 0 0 30px #4CAF50; z-index: 100; }

        #timetable-modal { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(20, 25, 35, 0.98); border: 2px solid #4CAF50; border-radius: 12px; padding: 25px; color: white; z-index: 200; min-width: 350px; box-shadow: 0 0 50px rgba(0,0,0,0.8);}
        #timetable-modal h2 { font-size: 20px; margin-bottom: 15px; text-align: center; color: #4CAF50;}
        .tt-table { width: 100%; border-collapse: collapse; font-size: 14px; text-align: center;}
        .tt-table th, .tt-table td { padding: 10px; border-bottom: 1px solid #333; }
        .tt-table th { color: #888; }
        .late { color: #f44336; font-weight: bold;}
        .early { color: #4CAF50; font-weight: bold;}
        .ontime { color: #fff; }
        #close-modal { margin-top: 20px; width: 100%; background: #4CAF50; color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold;}
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<!-- 出乘任务单 -->
<div id="start-overlay">
    <div class="task-card">
        <h1>🚄 出乘任务通知</h1>
        <div class="task-divider"></div>
        <div class="task-content">
            <p><b>司机同志：</b></p>
            <p>今日您的任务是担当高铁司机。</p>
            <p><b>值乘车次：</b><span class="highlight-train">G6801 次</span></p>
            <p><b>运行区间：</b>武汉站 → 信阳东站</p>
            <p><b>任务要求：</b>接下来的这段路将由您完成。请严格遵守 310 标尺运行图，盯紧 ATP 限速，精准对标停车。</p>
            <p>祝您一路平安，正点到达！</p>
        </div>
        <button id="start-btn">确认接车，开始驾驶</button>
    </div>
</div>

<!-- ATP 警告层 -->
<div id="atp-warning">⚠️ ATP 超速防护触发！<br>强制降速至 310km/h</div>
<div id="perfect-text">完美停车！</div>

<!-- 右上角 HUD -->
<div class="top-hud">
    <button id="btn-open-tt" style="background:#2c3545; color:white; border:1px solid #555; padding:6px 12px; border-radius:4px; cursor:pointer; margin-bottom:10px; font-size:12px; float:left;">📅 运行图</button>
    <div style="clear:both;"></div>
    <div class="next-station" id="next-station-text">下一站：孝感北站</div>
    <div class="dist" id="hud-dist">126000 m</div>
    <div class="time-info" id="hud-time" style="color: #fff;">计划到达: 08:25</div>
    <div class="time-info" id="hud-eta" style="color: #00bcd4;">预计到达: --:--</div>
    <div class="time-info" id="hud-delay" style="color: #4CAF50;">动态正晚点: --</div>
    
    <!-- 停车辅助标尺 -->
    <div id="parking-aid">
        <div style="font-size:12px; color:#fff; text-align:left; font-weight:bold;">停车辅助标尺</div>
        <div class="ruler-container">
            <div class="ruler-center-line"></div>
            <div class="ruler-slider" id="ruler-bar"></div>
            <div class="ruler-text" id="ruler-text">0 m</div>
        </div>
        <div class="ruler-marks"><span>-1000m</span><span>停车标</span><span>越站</span></div>
    </div>
</div>

<!-- 3D 渲染容器 -->
<div id="canvas-container"></div>

<!-- 底部控制台 -->
<div class="ui-layer">
    <div class="dashboard">
        <div>
            <div style="font-size:12px; color:#888;" id="current-station-text">当前站：武汉站</div>
            <div class="speed-display"><span id="speed">0</span> <span>km/h</span></div>
        </div>
        <div class="status-panel">
            <div id="info-text" style="color: #4CAF50; font-weight:bold;">请开门上客</div>
        </div>
    </div>
    
    <div class="slider-group">
        <label style="color:#4CAF50;">牵引</label>
        <input type="range" id="traction" min="0" max="4" value="0" step="1">
        <span class="value" id="val-traction" style="color:#4CAF50;">P0</span>
    </div>
    
    <div class="slider-group">
        <label style="color:#FF9800;">制动</label>
        <input type="range" id="brake" min="0" max="7" value="7" step="1">
        <span class="value" id="val-brake" style="color:#FF9800;">B7</span>
    </div>

    <div class="btn-grid">
        <button class="action-btn" id="btn-door">开门</button>
        <button class="action-btn danger" id="btn-ebrake">紧急制动</button>
        <button class="action-btn" id="btn-release">缓解 / 复位</button>
        <button class="action-btn warning" id="btn-reset-atp" style="display:none;">解除 ATP</button>
    </div>
</div>

<!-- 运行图弹窗 -->
<div id="timetable-modal">
    <h2>📊 G6801 次列车运行图</h2>
    <table class="tt-table">
        <thead>
            <tr><th>车站</th><th>计划到达</th><th>实际到达</th><th>状态</th></tr>
        </thead>
        <tbody id="tt-body"></tbody>
    </table>
    <button id="close-modal">关闭运行图</button>
</div>

<script>
    // === 1. 核心数据与状态 ===
    // 时刻表：跑完126km大概需要25分钟，排图留有余量。停站2分钟，上下客90秒。
    const stations = [
        { name: "武汉站", targetDist: 0, plannedArr: null, plannedDep: "08:00", tracks: 6, width: 15 },
        { name: "孝感北站", targetDist: 126000, plannedArr: "08:25", plannedDep: "08:27", tracks: 2, width: 8 },
        { name: "信阳东站", targetDist: 199000, plannedArr: "08:42", plannedDep: null, tracks: 3, width: 10 }
    ];
    
    let currentStationIndex = 0; 
    let nextStationIndex = 1;    
    let totalDistance = 0;       // 米
    let speedMs = 0;             // m/s
    let traction = 0;
    let brake = 7; 
    let doorOpen = false;
    let gameStarted = false;
    let atpStatus = 'normal';    // normal, triggered, released
    
    // 时间系统 (从 08:00:00 开始)
    let gameTimeSeconds = 8 * 3600; 
    let lastFrameTime = performance.now();
    
    // 停站系统
    let isBoarding = false;      
    let boardingTimeLeft = 0;    
    let canDepart = false;       
    let actualArrivalTimes = [null, null, null]; 

    // === 2. Three.js 场景初始化 ===
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB);
    scene.fog = new THREE.Fog(0x87CEEB, 100, 1200);

    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 2000);
    camera.position.set(0, 2.5, 0); 

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    container.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(10, 20, 10);
    scene.add(dirLight);

    // 轨道系统 (无限循环)
    const trackLength = 1500; 
    const railMat = new THREE.MeshLambertMaterial({ color: 0x888888 });
    const railGeo = new THREE.BoxGeometry(0.1, 0.2, trackLength);
    const railLeft = new THREE.Mesh(railGeo, railMat); railLeft.position.set(-0.75, 0, -trackLength/2); scene.add(railLeft);
    const railRight = new THREE.Mesh(railGeo, railMat); railRight.position.set(0.75, 0, -trackLength/2); scene.add(railRight);

    const sleepers = [];
    const sleeperGeo = new THREE.BoxGeometry(2.5, 0.1, 0.5);
    const sleeperMat = new THREE.MeshLambertMaterial({ color: 0x4a3b2c });
    for (let i = 0; i < 300; i++) { 
        const s = new THREE.Mesh(sleeperGeo, sleeperMat);
        s.position.set(0, -0.05, -i * 5);
        scene.add(s); sleepers.push(s);
    }

    const poles = [];
    const poleGeo = new THREE.BoxGeometry(0.3, 8, 0.3);
    const poleMat = new THREE.MeshLambertMaterial({ color: 0x555555 });
    for (let i = 0; i < 30; i++) {
        const p = new THREE.Mesh(poleGeo, poleMat);
        p.position.set(-4, 3.5, -i * 50);
        scene.add(p); poles.push(p);
    }

    // 驾驶室
    const cabinMat = new THREE.MeshLambertMaterial({ color: 0x1a1a1a });
    const dash = new THREE.Mesh(new THREE.BoxGeometry(3, 0.8, 1), cabinMat); dash.position.set(0, 1.2, -1); scene.add(dash);
    const leftF = new THREE.Mesh(new THREE.BoxGeometry(0.2, 2.5, 1), cabinMat); leftF.position.set(-1.6, 2.5, -1); scene.add(leftF);
    const rightF = new THREE.Mesh(new THREE.BoxGeometry(0.2, 2.5, 1), cabinMat); rightF.position.set(1.6, 2.5, -1); scene.add(rightF);
    const topF = new THREE.Mesh(new THREE.BoxGeometry(3.4, 0.2, 1), cabinMat); topF.position.set(0, 3.8, -1); scene.add(topF);

    // 站台
    const platformGroup = new THREE.Group();
    scene.add(platformGroup);
    function buildPlatform(stationData) {
        while(platformGroup.children.length > 0){ platformGroup.remove(platformGroup.children[0]); }
        const platLength = 450; 
        const platWidth = stationData.width;
        const platMat = new THREE.MeshLambertMaterial({ color: 0xaaaaaa });
        const platform = new THREE.Mesh(new THREE.BoxGeometry(platWidth, 1.2, platLength), platMat);
        platform.position.set(2.5 + platWidth/2, 0.6, -platLength/2);
        platformGroup.add(platform);
        const stopSign = new THREE.Mesh(new THREE.BoxGeometry(0.2, 3, 0.2), new THREE.MeshLambertMaterial({ color: 0xff0000 }));
        stopSign.position.set(2.5, 1.5, 0); platformGroup.add(stopSign);
    }

    // === 3. UI 元素与时刻表逻辑 ===
    const domSpeed = document.getElementById('speed');
    const domHudDist = document.getElementById('hud-dist');
    const domNextStation = document.getElementById('next-station-text');
    const domCurrentStation = document.getElementById('current-station-text');
    const domInfo = document.getElementById('info-text');
    const domPerfect = document.getElementById('perfect-text');
    const domHudTime = document.getElementById('hud-time');
    const domHudEta = document.getElementById('hud-eta');
    const domHudDelay = document.getElementById('hud-delay');
    const parkingAid = document.getElementById('parking-aid');
    const rulerBar = document.getElementById('ruler-bar');
    const rulerText = document.getElementById('ruler-text');
    const atpWarning = document.getElementById('atp-warning');
    const btnResetAtp = document.getElementById('btn-reset-atp');

    function formatTime(seconds) {
        let h = Math.floor(seconds / 3600) % 24;
        let m = Math.floor((seconds % 3600) / 60);
        let s = Math.floor(seconds % 60);
        return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    }

    function parseTimeToSeconds(timeStr) {
        if(!timeStr) return null;
        let parts = timeStr.split(':');
        return parseInt(parts[0])*3600 + parseInt(parts[1])*60;
    }

    function updateTimetableUI() {
        let tbody = document.getElementById('tt-body');
        tbody.innerHTML = '';
        stations.forEach((st, idx) => {
            let tr = document.createElement('tr');
            let actualArr = actualArrivalTimes[idx] ? formatTime(actualArrivalTimes[idx]).substring(0,5) : '--';
            let delayText = '--';
            let cls = 'ontime';
            
            if (idx > 0 && actualArrivalTimes[idx] && st.plannedArr) {
                let plannedSec = parseTimeToSeconds(st.plannedArr);
                let diff = actualArrivalTimes[idx] - plannedSec;
                if (diff > 30) { delayText = `晚点 ${Math.ceil(diff/60)}分`; cls = 'late'; }
                else if (diff < -30) { delayText = `早点 ${Math.floor(Math.abs(diff)/60)}分`; cls = 'early'; }
                else { delayText = '正点'; }
            }
            tr.innerHTML = `<td>${st.name}</td><td>${st.plannedArr || '--'}</td><td>${actualArr}</td><td class="${cls}">${delayText}</td>`;
            tbody.appendChild(tr);
        });
    }

    document.getElementById('btn-open-tt').addEventListener('click', () => {
        updateTimetableUI();
        document.getElementById('timetable-modal').style.display = 'block';
    });
    document.getElementById('close-modal').addEventListener('click', () => {
        document.getElementById('timetable-modal').style.display = 'none';
    });

    document.getElementById('start-btn').addEventListener('click', () => {
        document.getElementById('start-overlay').style.opacity = '0';
        setTimeout(() => { 
            document.getElementById('start-overlay').style.display = 'none'; 
            gameStarted = true; 
            lastFrameTime = performance.now();
            // 始发站自动触发上下客
            doorOpen = true;
            document.getElementById('btn-door').innerText = "关门";
            document.getElementById('btn-door').classList.add('active');
            isBoarding = true;
            boardingTimeLeft = 90;
            domInfo.innerText = `始发站上下客中... 剩余 90 秒`;
            domInfo.style.color = "#FF9800";
        }, 500);
        buildPlatform(stations[0]); 
    });

    // 开门/关门逻辑
    document.getElementById('btn-door').addEventListener('click', () => {
        if (speedMs > 0.1) { domInfo.innerText = "⚠️ 未停稳，禁止开门！"; domInfo.style.color = "#f44336"; return; }
        
        const distToStop = Math.abs(stations[nextStationIndex].targetDist - totalDistance);
        
        if (!doorOpen) {
            if (distToStop <= 2.0) { 
                doorOpen = true;
                document.getElementById('btn-door').innerText = "关门";
                document.getElementById('btn-door').classList.add('active');
                parkingAid.style.display = 'none';
                
                if (distToStop <= 0.5) {
                    domPerfect.style.display = 'block';
                    setTimeout(() => domPerfect.style.display = 'none', 2000);
                }
                
                isBoarding = true;
                boardingTimeLeft = 90; 
                domInfo.innerText = `上下客中... 剩余 ${boardingTimeLeft} 秒`;
                domInfo.style.color = "#FF9800";
                
            } else {
                domInfo.innerText = "未到达停车标，无法开门！";
                domInfo.style.color = "#f44336";
            }
        } else {
            // 关门
            if (isBoarding && boardingTimeLeft > 0) {
                domInfo.innerText = "⚠️ 乘客尚未上下完毕，强制关门！";
                isBoarding = false;
            } else {
                domInfo.innerText = "车门已关";
            }
            
            doorOpen = false;
            document.getElementById('btn-door').innerText = "开门";
            document.getElementById('btn-door').classList.remove('active');
            
            currentStationIndex = nextStationIndex;
            nextStationIndex++;
            
            if (nextStationIndex >= stations.length) {
                domNextStation.innerText = "运行结束";
                domInfo.innerText = "感谢游玩！已到达终点站";
                canDepart = false;
            } else {
                domCurrentStation.innerText = "当前站：" + stations[currentStationIndex].name;
                domNextStation.innerText = "下一站：" + stations[nextStationIndex].name;
                buildPlatform(stations[nextStationIndex]);
                
                let plannedDepSec = parseTimeToSeconds(stations[currentStationIndex].plannedDep);
                if (gameTimeSeconds < plannedDepSec) {
                    canDepart = false;
                    let waitTime = Math.ceil(plannedDepSec - gameTimeSeconds);
                    domInfo.innerText = `车门已关，等待发车时刻 (还需 ${waitTime} 秒)`;
                    domInfo.style.color = "#FF9800";
                } else {
                    canDepart = true;
                    domInfo.innerText = "已到发车时刻，允许牵引！";
                    domInfo.style.color = "#4CAF50";
                }
            }
        }
    });

    // 滑块互锁
    const tractionSlider = document.getElementById('traction');
    const brakeSlider = document.getElementById('brake');

    tractionSlider.addEventListener('input', (e) => {
        if (doorOpen || !canDepart || atpStatus === 'triggered' || nextStationIndex >= stations.length) { 
            tractionSlider.value = 0; 
            if (!canDepart && !doorOpen && speedMs === 0 && nextStationIndex < stations.length) {
                domInfo.innerText = "⚠️ 发车时刻未到，无法牵引！";
                domInfo.style.color = "#f44336";
            }
            return; 
        }
        traction = parseInt(e.target.value);
        document.getElementById('val-traction').innerText = "P" + traction;
        if (traction > 0 && brake > 0) { brakeSlider.value = 0; brake = 0; document.getElementById('val-brake').innerText = "B0"; }
    });

    brakeSlider.addEventListener('input', (e) => {
        brake = parseInt(e.target.value);
        document.getElementById('val-brake').innerText = "B" + brake;
        if (brake > 0 && traction > 0) { tractionSlider.value = 0; traction = 0; document.getElementById('val-traction').innerText = "P0"; }
    });

    document.getElementById('btn-release').addEventListener('click', () => { brake = 0; brakeSlider.value = 0; document.getElementById('val-brake').innerText = "B0"; });
    document.getElementById('btn-ebrake').addEventListener('click', () => { brake = 7; brakeSlider.value = 7; document.getElementById('val-brake').innerText = "B7"; traction = 0; tractionSlider.value = 0; document.getElementById('val-traction').innerText = "P0"; });
    
    btnResetAtp.addEventListener('click', () => {
        if (atpStatus === 'triggered' && speedMs * 3.6 <= 310) {
            atpStatus = 'released';
            atpWarning.style.display = 'none';
            btnResetAtp.style.display = 'none';
            domInfo.innerText = "ATP 已手动解除";
            domInfo.style.color = "#FF9800";
        }
    });

    // === 4. 核心物理与渲染循环 ===
    let clock = new THREE.Clock();

    function animate() {
        requestAnimationFrame(animate);
        const delta = clock.getDelta();

        if (gameStarted) {
            // 时间流逝
            let now = performance.now();
            let frameDelta = (now - lastFrameTime) / 1000;
            if (frameDelta < 1) { gameTimeSeconds += frameDelta; } // 防止切后台导致时间暴走
            lastFrameTime = now;

            // 上下客倒计时
            if (isBoarding) {
                boardingTimeLeft -= frameDelta;
                if (boardingTimeLeft <= 0) {
                    isBoarding = false; boardingTimeLeft = 0;
                    domInfo.innerText = "上下客完毕，请关门！";
                    domInfo.style.color = "#4CAF50";
                } else {
                    domInfo.innerText = `上下客中... 剩余 ${Math.ceil(boardingTimeLeft)} 秒`;
                }
            }

            // 等待发车逻辑
            if (!canDepart && !doorOpen && speedMs === 0 && nextStationIndex < stations.length) {
                let plannedDepSec = parseTimeToSeconds(stations[currentStationIndex].plannedDep);
                if (gameTimeSeconds >= plannedDepSec) {
                    canDepart = true;
                    domInfo.innerText = "发车时刻已到，允许牵引！";
                    domInfo.style.color = "#4CAF50";
                } else {
                    let waitTime = Math.ceil(plannedDepSec - gameTimeSeconds);
                    domInfo.innerText = `等待发车时刻 (还需 ${waitTime} 秒)`;
                }
            }

            // --- 拟真物理模型 ---
            let speedKmh = speedMs * 3.6;
            
            // ATP 超速拦截
            if (speedKmh > 355 && atpStatus !== 'triggered') {
                atpStatus = 'triggered';
                atpWarning.style.display = 'block';
                btnResetAtp.style.display = 'block';
                traction = 0; tractionSlider.value = 0; document.getElementById('val-traction').innerText = "P0";
                brake = 3; brakeSlider.value = 3; document.getElementById('val-brake').innerText = "B3";
            }
            if (atpStatus === 'triggered') {
                if (speedKmh <= 310) atpWarning.innerHTML = "✅ 已降至 310km/h<br>请点击解除 ATP";
            } else if (atpStatus === 'released') {
                if (speedKmh > 355) {
                    atpStatus = 'triggered';
                    atpWarning.innerHTML = "⚠️ ATP 再次触发！<br>强制降速至 310km/h";
                    atpWarning.style.display = 'block';
                    btnResetAtp.style.display = 'block';
                    traction = 0; tractionSlider.value = 0; document.getElementById('val-traction').innerText = "P0";
                    brake = 3; brakeSlider.value = 3; document.getElementById('val-brake').innerText = "B3";
                }
            }

            // 牵引力 (最大0.85，随速度衰减，P1-P4比例分配)
            let maxAccel = 0.85; 
            let speedFactor = Math.max(0.05, 1 - Math.pow(speedMs / 130, 1.5)); 
            let levelRatio = [0, 0.25, 0.50, 0.75, 1.0][traction] || 0;
            let tractionAccel = maxAccel * speedFactor * levelRatio;

            // 制动力 (B1-B7，低速增益)
            let brakeAccel = 0;
            if (brake > 0) {
                let brakeBase = [0, 0.15, 0.35, 0.55, 0.80, 1.10, 1.50, 2.20][brake];
                let speedFactorBrake = speedKmh < 40 ? 1.3 : (speedKmh > 250 ? 0.8 : 1.0);
                brakeAccel = brakeBase * speedFactorBrake;
            }

            // 阻力与积分
            let resistance = 0.01 + 0.00025 * speedMs * speedMs; 
            let netAccel = tractionAccel - brakeAccel - resistance;
            speedMs += netAccel * delta;
            if (speedMs < 0) speedMs = 0;
            
            totalDistance += speedMs * delta;
            if (speedMs > 1) canDepart = false; // 移动后重置发车联锁

            // --- HUD 与 ETA 更新 ---
            domSpeed.innerText = Math.floor(speedMs * 3.6);
            
            if (nextStationIndex < stations.length) {
                let distToNext = stations[nextStationIndex].targetDist - totalDistance;
                if (distToNext < 0) distToNext = 0; 
                domHudDist.innerText = distToNext.toFixed(1) + " m";
                domHudDist.style.color = distToNext < 1000 ? (distToNext < 50 ? "#f44336" : "#FF9800") : "#4CAF50";
                
                // 停车标尺 (1公里内)
                if (distToNext <= 1000 && distToNext > -50 && !doorOpen) {
                    parkingAid.style.display = 'block';
                    let percent = Math.max(0, (distToNext / 1000) * 100);
                    rulerBar.style.width = percent + "%";
                    rulerText.innerText = Math.floor(distToNext) + " m";
                    rulerBar.style.background = distToNext < 50 ? "rgba(244, 67, 54, 0.6)" : "rgba(76, 175, 80, 0.4)";
                } else {
                    parkingAid.style.display = 'none';
                }

                // ETA 推演
                if (speedMs > 5) {
                    let etaSeconds = distToNext / speedMs;
                    let plannedArrSeconds = parseTimeToSeconds(stations[nextStationIndex].plannedArr);
                    let estimatedArrival = gameTimeSeconds + etaSeconds + 40; // 估算40秒减速余量
                    
                    domHudEta.innerText = `预计到达: ${formatTime(estimatedArrival).substring(0, 5)}`;
                    let diff = estimatedArrival - plannedArrSeconds;
                    if (diff > 30) { domHudDelay.innerText = `预计晚点 ${Math.floor(diff/60)}分`; domHudDelay.style.color = "#f44336"; }
                    else if (diff < -30) { domHudDelay.innerText = `预计早点 ${Math.floor(Math.abs(diff)/60)}分`; domHudDelay.style.color = "#FF9800"; }
                    else { domHudDelay.innerText = `预计正点`; domHudDelay.style.color = "#4CAF50"; }
                }
                
                // 记录到达时间
                if (distToNext <= 0.1 && actualArrivalTimes[nextStationIndex] === null && speedMs === 0) {
                    actualArrivalTimes[nextStationIndex] = gameTimeSeconds;
                    let plannedSec = parseTimeToSeconds(stations[nextStationIndex].plannedArr);
                    let diff = gameTimeSeconds - plannedSec;
                    if (diff > 0) domHudDelay.innerHTML = `<span class="late">已晚点 ${Math.floor(diff/60)}分</span>`;
                    else domHudDelay.innerHTML = `<span class="early">已早点 ${Math.floor(Math.abs(diff)/60)}分</span>`;
                }
            }

            // 环境移动
            const moveSpeed = speedMs * delta;
            sleepers.forEach(s => { s.position.z += moveSpeed; if (s.position.z > 10) s.position.z -= 1500; });
            poles.forEach(p => { p.position.z += moveSpeed; if (p.position.z > 10) p.position.z -= 1500; });

            // 震动
            if (speedMs > 0) {
                camera.position.y = 2.5 + Math.sin(Date.now() * 0.01) * (speedMs * 0.00005);
            } else {
                camera.position.y = 2.5;
            }
        }
        renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
</script>
</body>
</html>
